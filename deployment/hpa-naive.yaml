apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: canvas-web
  namespace: canvas
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: canvas-web
  minReplicas: 1
  maxReplicas: 5
  # Stage 3 (HPA naive) — STOCK HPA an unsophisticated engineer would deploy:
  # only CPU target = 80 %, NO behavior block, deployment uses VPA-recommended
  # resources. Kubernetes applies its built-in scale policies:
  #   scaleDown.stabilizationWindowSeconds = 300 (5 min)
  #   scaleUp.stabilizationWindowSeconds   = 0 (reacts immediately to spikes)
  #   scaleUp policy   = up to 100% or 4 pods per 60s, whichever is greater
  #   scaleDown policy = up to 100% per 60s
  # Compare to Stage 4 (hpa.yaml) which lowers the target, adds a 30s scaleUp
  # window, and caps scale-up rate. Same resources, different tuning — the
  # delta is *only* the HPA configuration.
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: canvas-jobs
  namespace: canvas
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: canvas-jobs
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
