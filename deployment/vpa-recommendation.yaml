---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: canvas-web-vpa
  namespace: canvas
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: canvas-web
  updatePolicy:
    updateMode: "Off"       # recommendation only — never touches actual pods
  resourcePolicy:
    containerPolicies:
      - containerName: web
        controlledResources: ["cpu", "memory"]
        minAllowed:
          cpu: 200m
          memory: 512Mi
        maxAllowed:
          cpu: "4"
          memory: 8Gi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: canvas-jobs-vpa
  namespace: canvas
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: canvas-jobs
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: jobs
        controlledResources: ["cpu", "memory"]
        minAllowed:
          cpu: 100m
          memory: 256Mi
        maxAllowed:
          cpu: "2"
          memory: 4Gi
