apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: canvas-monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.canvas-monitoring.svc.cluster.local:9090
        isDefault: true
        editable: true
      # Direct PostgreSQL data source for live jobs-tier metrics. Reads
      # delayed_jobs and pg_stat_user_tables on every panel refresh — gives
      # instantaneous queue depth, oldest pending age, and cumulative
      # throughput counter without needing an exporter. Credentials are
      # injected from the canvas-secret-mirror Secret (must exist in this
      # namespace; see kustomize/grafana-secret-sync README note).
      - name: CanvasPostgres
        uid: canvas-postgres
        type: postgres
        access: proxy
        url: postgres.canvas.svc.cluster.local:5432
        user: $DB_USER
        secureJsonData:
          password: $DB_PASSWORD
        jsonData:
          database: $DB_NAME
          sslmode: disable
          maxOpenConns: 5
          maxIdleConns: 2
          connMaxLifetime: 14400
          postgresVersion: 1500
          timescaledb: false
        editable: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: Canvas
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: canvas-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana-oss:11.1.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            # Postgres credentials interpolated by Grafana into datasources.yaml
            # ($DB_USER / $DB_PASSWORD / $DB_NAME). The canvas-secret-mirror
            # Secret in canvas-monitoring is created by mirroring the canvas
            # namespace's canvas-secret — see jobs-grafana-setup.sh.
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: canvas-secret-mirror
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: canvas-secret-mirror
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: canvas-secret-mirror
                  key: DB_NAME
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: grafana-dashboard
              mountPath: /var/lib/grafana/dashboards/canvas-local-dashboard.json
              subPath: canvas-local-dashboard.json
            - name: grafana-jobs-dashboard
              mountPath: /var/lib/grafana/dashboards/jobs-tier-dashboard.json
              subPath: jobs-tier-dashboard.json
      volumes:
        - name: grafana-storage
          emptyDir: {}
        - name: grafana-provisioning
          configMap:
            name: grafana-provisioning
        - name: grafana-dashboard
          configMap:
            name: grafana-dashboard
        - name: grafana-jobs-dashboard
          configMap:
            name: grafana-jobs-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: canvas-monitoring
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30091
